# Render Blueprint: deploys all three services on the free tier.
# One "New > Blueprint" action in the Render dashboard provisions and wires everything.
# Secrets (sync: false) are entered in the dashboard, never committed here.
#
# Keep the three `name:` values in sync with the URLs referenced in MCP_URL / CORS_ORIGINS /
# VITE_API_BASE_URL below — they resolve to https://<name>.onrender.com.
services:
  # --- MCP server (Docker web service; wraps the Spotify Web API) ---
  - type: web
    name: song-recommender-mcp
    runtime: docker
    dockerfilePath: ./mcp_server/Dockerfile
    dockerContext: ./mcp_server
    plan: free
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

  # --- Backend (Docker web service; FastAPI + LangGraph agent) ---
  - type: web
    name: song-recommender-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: MCP_URL
        value: https://song-recommender-mcp.onrender.com/mcp
      - key: CORS_ORIGINS
        value: https://song-recommender-frontend.onrender.com

  # --- Frontend (static site — free and always-on) ---
  - type: web
    name: song-recommender-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the Vite build at build time — must be set before the build runs.
      # Uses the backend's Render-assigned hostname: the plain `song-recommender-backend`
      # subdomain was already taken, so Render suffixed this service with `-tt5c`.
      - key: VITE_API_BASE_URL
        value: https://song-recommender-backend-tt5c.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
